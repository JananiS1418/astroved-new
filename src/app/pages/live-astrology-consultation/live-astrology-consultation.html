<div class="page-wrapper">
  <app-navbar></app-navbar>
  <main>
    <app-banner></app-banner>
    <app-trust-banner></app-trust-banner>
    <app-questions></app-questions>

    <app-booking-info></app-booking-info>
    <app-astrologers></app-astrologers>
    <app-testimonials></app-testimonials>
    <app-why-choose></app-why-choose>

    <app-faq></app-faq>
  </main>
  <app-footer></app-footer>

  <!-- Sticky CTA Bar -->
  <div class="sticky-cta-bar" [class.visible]="isStickyVisible">
    <div class="sticky-cta-content">
      <div class="sticky-cta-text">
        <span class="sticky-title">Get Answers Now</span>
        <span class="sticky-urgency">🔥 Limited slots available!</span>
      </div>
      <button class="btn-primary sticky-btn" (click)="scrollToAstrologers()">
        BOOK CONSULTATION
      </button>
    </div>
  </div>

  <!-- Scroll to Top Button -->
  <button class="scroll-top-btn" [class.visible]="isStickyVisible" (click)="scrollToTop()" aria-label="Scroll to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</div>
